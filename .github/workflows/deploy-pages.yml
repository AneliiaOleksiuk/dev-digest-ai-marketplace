name: Deploy Marketplace UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — build-index.mjs reads per-file git log dates

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: node scripts/validate-marketplace.mjs

      - run: npm ci
        working-directory: site

      # "prebuild" (npm lifecycle) runs scripts/build-index.mjs before this.
      - run: npm run build
        working-directory: site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
