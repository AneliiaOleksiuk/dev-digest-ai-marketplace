name: Deploy Marketplace UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Same check `validate.yml` runs on every PR/push to main — kept here too,
  # as its own job, so a manual `workflow_dispatch` deploy (which validate.yml
  # never sees, since it isn't a pull_request or a push) still gets gated
  # instead of publishing an unvalidated marketplace.json straight to Pages.
  validate:
    name: Validate marketplace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/validate-marketplace.mjs

  build-site:
    name: Build marketplace-ui
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — build-index.mjs reads per-file git log dates

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci
        working-directory: marketplace-ui

      # "prebuild" (npm lifecycle) runs scripts/build-index.mjs before this.
      - run: npm run build
        working-directory: marketplace-ui

      - uses: actions/upload-pages-artifact@v3
        with:
          path: marketplace-ui/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build-site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
